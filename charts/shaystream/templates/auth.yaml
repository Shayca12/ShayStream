apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: {{ .Values.images.auth }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 3001
          env:
            # שולפים creds מה-Secret, ומרכיבים מהם DATABASE_URL עם תחביר $(VAR).
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: shaystream-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shaystream-secret, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: 'postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/shaystream?schema=public'
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: shaystream-secret, key: JWT_SECRET } }
            - name: JWT_EXPIRES_IN
              valueFrom: { secretKeyRef: { name: shaystream-secret, key: JWT_EXPIRES_IN } }
            - name: PORT
              value: '3001'
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 3001
      targetPort: 3001
