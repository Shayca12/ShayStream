# Ingress — נקודת הכניסה היחידה מבחוץ. מנתב לפי נתיב:
#   /auth → auth · /media → media · /stream → stream · השאר → frontend
# (Traefik, שמגיע מובנה עם k3d, מתעדף נתיב ארוך יותר, אז /auth גובר על /)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shaystream
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3001
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: media
                port:
                  number: 3002
          - path: /stream
            pathType: Prefix
            backend:
              service:
                name: stream
                port:
                  number: 3005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
