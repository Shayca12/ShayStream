# ─────────────────────────────────────────────────────────────
#  ShayStream — Local development stack (docker-compose)
#  כרגע: רק PostgreSQL. נוסיף MinIO, את השירותים ו-Traefik בהמשך שלב 1.
#  הרצה:  docker compose up -d postgres
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine # דימוי (image) רשמי של Postgres 16, גרסת alpine קלה
    container_name: shaystream-postgres
    restart: unless-stopped # יעלה מחדש אוטומטית אם קרס (אלא אם עצרנו ידנית)
    environment: # משתני הסביבה שמאתחלים את ה-DB. נלקחים מקובץ .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container. משתמשים ב-5433 על ה-host כי 5432 כבר תפוס (cinemaops).
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data # הנתונים נשמרים גם אחרי כיבוי הקונטיינר
    healthcheck: # Docker יבדוק שה-DB באמת מוכן לקבל חיבורים
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: # "named volume" מנוהל ע"י Docker — כאן חיים קבצי ה-DB
